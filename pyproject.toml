[project]
name = "leavepulse-public-api-contract"
version = "0.1.0"
description = "Code-first public API contract DSL and generators for LeavePulse"
requires-python = "~=3.14.0"
dependencies = [
    "msgspec>=0.21.0,<0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/leavepulse_public_api_contract"]

[tool.hatch.build.targets.wheel]
include = ["src/leavepulse_public_api_contract"]

[tool.hatch.build.targets.wheel.sources]
"src/leavepulse_public_api_contract" = "leavepulse_public_api_contract"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
